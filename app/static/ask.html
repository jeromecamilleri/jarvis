<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — Ask</title>
<style>
  body { font-family: sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem 1rem; font-size: 1rem; }
  .msg { white-space: pre-wrap; margin: 1rem 0; padding: .6rem .8rem; border-radius: .4rem; }
  .user { background: #e8f0fe; }
  .jarvis { background: #f1f3f4; }
  .error { background: #fde8e8; }
</style>
</head>
<body>
<h1>Jarvis</h1>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Pose ta question…" autofocus required>
  <button id="send" type="submit">Send</button>
</form>
<div id="log"></div>
<script>
  let conversationId = null;
  const form = document.getElementById("form"), text = document.getElementById("text");
  const send = document.getElementById("send"), log = document.getElementById("log");

  function add(kind, content) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = content;
    log.prepend(div);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = text.value.trim();
    if (!message) return;
    add("user", message);
    text.value = "";
    send.disabled = true;
    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message, conversation_id: conversationId}),
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      conversationId = data.conversation_id;
      add("jarvis", data.reply);
    } catch (e) {
      add("error", "Erreur : " + e.message);
    } finally {
      send.disabled = false;
      text.focus();
    }
  });
</script>
</body>
</html>
